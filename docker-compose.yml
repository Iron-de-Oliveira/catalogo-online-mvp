services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: catalogo_online
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ironoliveira/catalogo-backend:latest
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://postgres:123456@postgres:5432/catalogo_online?schema=public"
      JWT_SECRET: "iron123"
      PORT: 3333
    ports:
      - "3333:3333"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    image: ironoliveira/catalogo-frontend:latest
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  uploads_data: